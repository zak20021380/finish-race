# Detour matchmaking backend — the 1v1 waiting room.
#
# The client build (Vite, `src/`) never imports anything under `worker/`: wrangler bundles the
# worker on its own, so `npm run build` stays a static frontend build and the two never touch.
#
# Local:   npx wrangler dev            (needs a .dev.vars, see below)
# Deploy:  npx wrangler deploy         (then set the secret with `wrangler secret put`)

name = "finish-race"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# The built Mini App (`npm run build` -> dist/): served from the same Worker on `/` and the
# hashed asset paths, while `/api/*`, `/ws/*`, `/admin/*` and `/health` stay with the script.
assets = { directory = "./dist", binding = "ASSETS" }

# One singleton instance holds the whole waiting room, so every socket that asks for a 1v1 lands
# on the same object and pairing is a local lookup rather than a fan-out across many instances.
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

# One singleton edition ledger: hard caps, sequential serials and one claim per player per badge.
# The object serializes every mint, so no two callers can ever read the same counter value.
[[durable_objects.bindings]]
name = "BADGES"
class_name = "BadgeMintDO"

# The modern (SQLite-backed) Durable Object migration. The waiting queue itself is in memory —
# the storage engine is only what the class is declared on.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchmakerDO"]

# The badge ledger persists counters and claims in the object's own storage, so it survives
# eviction; the queue inside `BadgeMintDO` is what makes each counter read-and-increment atomic.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BadgeMintDO"]

[vars]
# `true` lets a local browser queue as a guest with no valid initData. Deployed: keep it false,
# and put the real values in `.dev.vars` for local work:
#
#   TELEGRAM_BOT_TOKEN = "<token from @BotFather>"
#   DEV_AUTH = "true"
DEV_AUTH = "false"

# Who may call `/admin/*` — the Command Center's server half (see `src/admin.ts`, `worker/auth.ts`).
# A comma-separated list of Telegram user ids, mirroring the panel's own `ADMIN_IDS` allowlist.
# An empty value closes the Telegram door entirely; `/admin/status` still answers a dev-marked
# loopback request while `DEV_AUTH = "true"` or the caller is on localhost.
ADMIN_IDS = "1350508522"
