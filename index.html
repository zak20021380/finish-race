<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eeeaf8" />
    <meta name="color-scheme" content="light" />
    <title>Finish Race</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!-- one flag glyph, reused by the header and the end-of-game panel -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <symbol id="i-flag" viewBox="0 0 24 24">
        <defs><clipPath id="i-flag-clip"><rect x="6.6" y="3.2" width="14.6" height="10.6" rx="1.8" /></clipPath></defs>
        <path d="M5 2.6v18.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" />
        <g clip-path="url(#i-flag-clip)">
          <rect x="6.6" y="3.2" width="14.6" height="10.6" rx="1.8" fill="currentColor" opacity=".22" />
          <g fill="currentColor">
            <rect x="6.6" y="3.2" width="3.65" height="3.53" />
            <rect x="13.9" y="3.2" width="3.65" height="3.53" />
            <rect x="10.25" y="6.73" width="3.65" height="3.53" />
            <rect x="17.55" y="6.73" width="3.65" height="3.53" />
            <rect x="6.6" y="10.27" width="3.65" height="3.53" />
            <rect x="13.9" y="10.27" width="3.65" height="3.53" />
          </g>
        </g>
      </symbol>
    </svg>

    <div class="bg" aria-hidden="true">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <div id="app">
      <main class="card">
        <div class="board-slot">
          <div class="board-wrap" id="board-wrap">
            <canvas id="board" role="img" aria-label="Race board: red and blue tokens race to the checkered finish strip along the top row"></canvas>

            <!-- the finish lives in the board; this is its only label -->
            <span class="finish-pill">
              <svg class="ico" aria-hidden="true"><use href="#i-flag" /></svg><span class="label">FINISH</span>
            </span>

            <!-- why a slot was refused, or the "tap again" prompt -->
            <p class="note" id="note" aria-live="polite"></p>

            <!-- one-time hint -->
            <div class="hint" id="hint" hidden>
              <span class="hint-text">Tap a grid line to place a wall</span>
              <button class="hint-x" id="hint-x" type="button" aria-label="Dismiss hint">&times;</button>
            </div>
          </div>
        </div>

        <footer class="chips">
          <div class="chip red" id="chip-0">
            <span class="ball" aria-hidden="true"></span>
            <span class="who" id="name-0">YOU</span>
            <span class="steps" id="steps-0">11 steps</span>
          </div>
          <div class="chip blue" id="chip-1">
            <span class="ball" aria-hidden="true"></span>
            <span class="who" id="name-1">BOT</span>
            <span class="steps" id="steps-1">11 steps</span>
          </div>
        </footer>
      </main>

      <p class="status" id="status" role="status" aria-live="polite">
        <span id="status-text"></span><span class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </p>

      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

      <div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="verdict">
        <div class="panel">
          <svg class="flag" aria-hidden="true"><use href="#i-flag" /></svg>
          <p class="verdict" id="verdict">You win</p>
          <p class="sub" id="sub">You reached the finish first.</p>
          <button class="cta" id="again" type="button">Play again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
