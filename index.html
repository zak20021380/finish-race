<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e6ef" />
    <title>Finish Race</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <main class="card">
        <header class="finish">
          <span class="line"></span>
          <span class="label">🏁 FINISH</span>
          <span class="line"></span>
        </header>
        <div class="board-wrap" id="board-wrap"><canvas id="board"></canvas></div>
        <footer class="names">
          <span class="red" id="name-red">▲ YOU</span><span class="sep">·</span><span class="blue" id="name-blue">BOT</span>
        </footer>
      </main>
      <section class="status">
        <p id="status"></p>
        <button class="btn" id="again" hidden>Play again</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
