<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e7e6ef" />
    <meta name="color-scheme" content="light" />
    <title>Finish Race</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <main class="card">
        <header class="finish">
          <span class="line"></span>
          <span class="label">🏁 FINISH</span>
          <span class="line"></span>
        </header>

        <div class="board-wrap" id="board-wrap">
          <canvas id="board" role="img" aria-label="Race board: red and blue tokens race to the finish line"></canvas>

          <!-- why a slot was refused, or the "tap again" prompt -->
          <p class="note" id="note" aria-live="polite"></p>

          <!-- one-time hint -->
          <div class="hint" id="hint" hidden>
            <span class="hint-text">Tap a grid line to place a wall</span>
            <button class="hint-x" id="hint-x" type="button" aria-label="Dismiss hint">&times;</button>
          </div>
        </div>

        <footer class="chips">
          <div class="chip red" id="chip-0">
            <span class="ball" aria-hidden="true"></span>
            <span class="who" id="name-0">YOU</span>
            <span class="pips" id="pips-0" aria-hidden="true"></span>
          </div>
          <div class="chip blue" id="chip-1">
            <span class="ball" aria-hidden="true"></span>
            <span class="who" id="name-1">BOT</span>
            <span class="pips" id="pips-1" aria-hidden="true"></span>
          </div>
        </footer>
      </main>

      <p class="status" id="status" role="status" aria-live="polite">
        <span id="status-text"></span><span class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </p>

      <div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="verdict">
        <div class="panel">
          <p class="verdict" id="verdict">You win</p>
          <p class="sub" id="sub">You reached the finish first.</p>
          <button class="cta" id="again" type="button">Play again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
